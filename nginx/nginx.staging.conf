events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Next.js Staging App
    upstream nextjs_staging_upstream {
        server app_staging:3000;
    }

    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name staging.hotelyashgrand.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Staging Server
    server {
        listen 443 ssl http2;
        server_name staging.hotelyashgrand.com;

        # TLS / SSL Certificates
        ssl_certificate /etc/letsencrypt/live/staging.hotelyashgrand.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.hotelyashgrand.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Enterprise Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # SSE Realtime Event Stream
        location /api/events {
            proxy_pass http://nextjs_staging_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Static Asset Caching
        location /_next/static/ {
            proxy_pass http://nextjs_staging_upstream;
            proxy_set_header Host $host;
            expires 30d;
            access_log off;
        }

        # Default Next.js App Proxy
        location / {
            proxy_pass http://nextjs_staging_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
